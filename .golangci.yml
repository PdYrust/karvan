version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - funlen
    - gocyclo
    - gosec
    - misspell
    - nolintlint
    - revive
    - sqlclosecheck
    - rowserrcheck
    - unconvert
    - unparam
    - usestdlibvars
  settings:
    funlen:
      lines: 60
      statements: 40
    gocyclo:
      min-complexity: 15
    nolintlint:
      require-explanation: true
      require-specific: true
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: errorf
        - name: exported
        - name: increment-decrement
        - name: indent-error-flow
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: unreachable-code
        - name: var-naming
        - name: empty-block
        - name: file-length-limit
          arguments:
            - max: 500
              skipComments: false
              skipBlankLines: false
  exclusions:
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - funlen
          - gosec
          - unparam

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/PdYrust/karvan
