# Builds, tests, attests and publishes a release for a pushed v* tag (D31).
# Run by hand with dry_run (the default) it builds, tests and attests the
# same files but pushes no image and makes no release.
name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build, test and attest only; push no image, make no release
        type: boolean
        default: true
permissions: {}
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/pdyrust/karvan
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      ATTEST: ${{ github.event.repository.private == false }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
          cache: true
          cache_dependency_path: web/pnpm-lock.yaml
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/package.json
      - name: Pick the version and the release notes
        id: version
        run: |
          case $GITHUB_REF in
          refs/tags/v*) version=${GITHUB_REF_NAME#v} ;;
          *)
            if [ "$DRY_RUN" != true ]; then
              echo "::error::A release needs a v* tag. On a branch, run it as a dry run."
              exit 1
            fi
            version=0.0.0-dry.$GITHUB_RUN_NUMBER
            ;;
          esac
          if [ "$DRY_RUN" != true ]; then
            awk -v h="## Release notes $version" '$0 == h { on = 1; next } on && /^## / { exit } on' docs/release.md >"$RUNNER_TEMP/notes.md"
            if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
              echo "::error::docs/release.md has no '## Release notes $version' section."
              exit 1
            fi
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"
      - name: Build the release files
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          scripts/release/build.sh
          scripts/release/verify.sh dist
      - name: Install test on the amd64 archive
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ARCHIVE="$PWD/dist/karvan_${VERSION}_linux_amd64.tar.gz" make test-install
      - name: Sign in to ghcr.io
        if: env.DRY_RUN != 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # The Dockerfile only copies the binary of each architecture, so both
      # build on this runner without QEMU. A dry run keeps them local and
      # uses the image ID as the digest, as make release-dry does.
      - name: Build the images
        id: image
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          : >dist/image-digests
          for arch in amd64 arm64; do
            tag=$IMAGE:$VERSION-$arch
            docker buildx build --load --provenance=false --platform "linux/$arch" -t "$tag" \
              --build-arg VERSION="$VERSION" -f packaging/docker/Dockerfile dist/image
            if [ "$DRY_RUN" = true ]; then
              digest=$(docker image inspect -f '{{.Id}}' "$tag")
            else
              docker push -q "$tag"
              digest=$(docker image inspect -f '{{index .RepoDigests 0}}' "$tag")
              digest=${digest#*@}
            fi
            echo "linux/$arch $IMAGE@$digest" >>dist/image-digests
            echo "$arch=$digest" >>"$GITHUB_OUTPUT"
          done
          if [ "$DRY_RUN" != true ]; then
            docker buildx imagetools create -t "$IMAGE:$VERSION" "$IMAGE:$VERSION-amd64" "$IMAGE:$VERSION-arm64"
            index=$(docker buildx imagetools inspect "$IMAGE:$VERSION" | awk '$1 == "Digest:" { print $2; exit }')
            echo "$index" | grep -Eqx 'sha256:[0-9a-f]{64}'
            echo "index=$index" >>"$GITHUB_OUTPUT"
          fi
          cat dist/image-digests
      - name: List the attestation subjects
        run: |
          scripts/release/subjects.sh dist >"$RUNNER_TEMP/subjects"
          (cd dist && grep -v '@' "$RUNNER_TEMP/subjects" | xargs -n 1 basename | xargs sha256sum) >"$RUNNER_TEMP/files.sha256"
          {
            echo '## Attestation subjects'
            echo '```'
            cat "$RUNNER_TEMP/files.sha256"
            cat dist/image-digests
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
      - name: Attest the files
        if: env.ATTEST == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/files.sha256
      - name: Attest the amd64 image
        if: env.ATTEST == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.image.outputs.amd64 }}
          push-to-registry: ${{ env.DRY_RUN != 'true' }}
      - name: Attest the arm64 image
        if: env.ATTEST == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.image.outputs.arm64 }}
          push-to-registry: ${{ env.DRY_RUN != 'true' }}
      - name: Attest the image index
        if: env.ATTEST == 'true' && env.DRY_RUN != 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.image.outputs.index }}
          push-to-registry: true
      - name: Check the attestations
        if: env.ATTEST == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for f in dist/karvan_*.tar.gz dist/get.sh dist/SHA256SUMS; do
            gh attestation verify "$f" -R "$GITHUB_REPOSITORY"
          done
          if [ "$DRY_RUN" != true ]; then
            gh attestation verify "oci://$IMAGE:$VERSION" -R "$GITHUB_REPOSITORY"
          fi
      - name: Create the GitHub release
        if: env.DRY_RUN != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -- --verify-tag --title "Karvan $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
          case $VERSION in *-*) set -- "$@" --prerelease ;; esac
          gh release create "$GITHUB_REF_NAME" "$@" dist/karvan_*.tar.gz dist/get.sh dist/SHA256SUMS
